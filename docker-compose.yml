# Local dev orchestration — Next.js + FastAPI ×2 + worker + PostgreSQL + Meilisearch + Redis + MinIO
# Infra only:   docker compose up -d postgres redis meilisearch minio
# Full stack:   docker compose up --build

name: ecommerce-ai-platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.14
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey_change_me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  core-api:
    build: { context: ., dockerfile: deployment/docker/core-api.Dockerfile }
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey_change_me}
      ML_SERVICE_URL: http://ml-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-devInternalKey}
      JWT_SECRET: ${JWT_SECRET:-devJwtSecret_change_me}
      S3_ENDPOINT: http://minio:9000
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes: ["./services/core-api:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }

  # ── deferred to later phases (see build plan) ────────────────────────────
  # ml-service  → Phase 11+ (recommendation + forecasting models)
  # worker      → Phase 6   (Arq: search index sync, nightly rollups)
  #
  # ml-service:
  #   build: { context: ., dockerfile: deployment/docker/ml.Dockerfile }
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ecommerce}
  #     INTERNAL_API_KEY: ${INTERNAL_API_KEY:-devInternalKey}
  #     S3_ENDPOINT: http://minio:9000
  #     MODEL_DIR: /app/app/models
  #   ports: ["8001:8001"]
  #   volumes: ["./services/ml-service:/app"]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #
  # worker:
  #   build: { context: ., dockerfile: deployment/docker/worker.Dockerfile }
  #   command: arq app.main.WorkerSettings
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ecommerce}
  #     REDIS_URL: redis://redis:6379/0
  #     MEILI_URL: http://meilisearch:7700
  #     MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey_change_me}
  #     INTERNAL_API_KEY: ${INTERNAL_API_KEY:-devInternalKey}
  #   volumes: ["./services/worker:/app"]
  #   depends_on:
  #     redis: { condition: service_healthy }
  #     postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: deployment/docker/web.Dockerfile }
    command: pnpm --filter web dev
    environment:
      CORE_API_URL: http://core-api:8000/api/v1        # server-side (RSC / Route Handlers)
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MEILI_URL: http://meilisearch:7700
      MEILI_SEARCH_KEY: ${MEILI_SEARCH_KEY:-devSearchKey}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-devCookieSecret_change_me}
    ports: ["3000:3000"]
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
      - /app/node_modules
    depends_on: [core-api]

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
